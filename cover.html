<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>帕秋莉讲座 第 3 集 · 视频封面</title>
<style>
@font-face { font-family: WenKai; src: url(fonts/LXGWWenKai-Regular.ttf); font-display: block; }
html, body { margin: 0; background: #1a1418; }
canvas { display: block; max-width: 100%; margin: 0 auto; }
</style>
</head>
<body>
<!-- 第 3 集视频封面。默认 16:9（1920×1080）；?ar=43 出 4:3（1440×1080，单独排版，不是裁切）。导出 PNG：node tools/cover.mjs -->
<canvas id="c"></canvas>
<script src="src/core.js"></script>
<script src="src/kit.js"></script>
<script src="src/character/patchouli.js"></script>
<script src="src/character/cirno.js"></script>
<script src="src/props.js"></script>
<script src="src/tape.js"></script>
<script>
'use strict';
// 第 3 集封面（缩略图优先：缩到 480 宽也要认得出卷子、看得清标题）。
// 左半边：琪露诺把一张大卷子举过头顶（红笔大分数、一列红叉），身后斜插两张同样的卷子，旁边一张「错题 300 道」小签。
// 右半边：片名两行大字「「我是最强的」/ 只值 1 比特」，下面副标题「用信息论看人脑和大模型」和系列名，整块上下居中；
// 帕秋莉从右下角探头，ジト目看着琪露诺。
const CV_T = 2.4;
const CV_BG = '#2f2833', CV_CREAM = '#ece5d6', CV_CREAM2 = '#b9b0bd', CV_RED = '#e0a39e';
const CV_LAYOUT = {
  169: { w: 1920, cir: { x: 470, y: 1075, h: 700 }, paper: { s: .78 }, tag: { x: 70, y: 720 },
    head: { x: 1330, y: 385, max: 900, size: 132, lines: ['「我是最强的」', '只值 1 比特'], gap: 175, size2: 160 }, sub: { x: 1330, y: 695, size: 58 },
    series: { x: 1330, y: 780, size: 36 }, pch: { x: 1760, y: 1066, h: 760 } },
  43: { w: 1440, cir: { x: 330, y: 1075, h: 620 }, paper: { s: .7 }, tag: { x: 20, y: 860, s: .8 },
    head: { x: 1010, y: 400, max: 720, size: 104, lines: ['「我是最强的」', '只值 1 比特'], gap: 140, size2: 124 }, sub: { x: 1010, y: 650, size: 44 },
    series: { x: 1010, y: 720, size: 30 }, pch: { x: 1310, y: 1066, h: 640 } },
};

function cvBg(c, w) {
  c.fillStyle = CV_BG; c.fillRect(0, 0, w, H);
  grain(c, polyPath(rectPts(0, 0, w, H)), .1);
  const v = c.createRadialGradient(w * .3, H * .45, H * .15, w / 2, H / 2, w * .8); v.addColorStop(0, 'rgba(255,230,190,.08)'); v.addColorStop(1, 'rgba(8,4,12,.45)');
  c.fillStyle = v; c.fillRect(0, 0, w, H);
}

function cvDraw(c, L) {
  const w = L.w;
  cvBg(c, w);
  // 琪露诺举卷子：先用空画布取锚点，卷子画在她身后，再画她
  const cp = { x: L.cir.x, y: L.cir.y, h: L.cir.h, pose: 'hold', mood: 'proud', facing: 1, t: CV_T, blink: 0, mouth: .5, gesture: .6 };
  const an = drawCirno(document.createElement('canvas').getContext('2d'), cp), hy = (an.hands[0][1] + an.hands[1][1]) / 2, s = L.paper.s;
  const px = an.hold[0], py = hy + 40 - EP2.exam.h * s / 2;
  [[-150, 40, -.2, 17, 3311], [150, 30, .18, 23, 3321]].forEach(([dx, dy, r, sc, seed]) => {   // 身后斜插的两张
    c.save(); c.translate(px + dx, py + dy); c.scale(s * .92, s * .92); examPaper(c, { x: 0, y: 0, rot: r, score: sc, seed }); c.restore(); });
  c.save(); c.translate(px, py); c.scale(s, s); examPaper(c, { x: 0, y: 0, rot: -.04, score: 12, seed: 3301 }); c.restore();
  drawCirno(c, cp);
  // 「错题 300 道」小签：一张斜贴的纸条
  const tg = L.tag;
  c.save(); c.translate(tg.x + 120, tg.y); c.rotate(-.08); c.scale(tg.s || 1, tg.s || 1);
  cutPaper(c, rectPts(-150, -46, 300, 92, 6), '#f3e6d6', { seed: 3390, step: 20, blur: 8, sy: 4 });
  zh(c, '错题 300 道', 0, 16, { size: 46, align: 'center', color: P.red });
  c.restore();
  // 片名
  const hd = L.head;
  zh(c, hd.lines[0], hd.x, hd.y, { size: hd.size, align: 'center', color: CV_CREAM, outline: CV_CREAM, ow: hd.size * .04 });
  zh(c, hd.lines[1], hd.x, hd.y + hd.gap, { size: hd.size2, align: 'center', color: CV_RED, outline: CV_RED, ow: hd.size2 * .04 });
  zh(c, '用信息论看人脑和大模型', L.sub.x, L.sub.y, { size: L.sub.size, align: 'center', color: CV_CREAM });
  zh(c, '帕秋莉讲座 · 第 3 集', L.series.x, L.series.y, { size: L.series.size, align: 'center', color: CV_CREAM2 });
  drawPatchouli(c, { x: L.pch.x, y: L.pch.y, h: L.pch.h, pose: 'peek', mood: 'normal', facing: -1, look: .8, t: CV_T, blink: 0, mouth: 0 });
}

(async () => {
  await document.fonts.load('48px WenKai');
  const L = CV_LAYOUT[Q.get('ar') === '43' ? 43 : 169], cv = document.getElementById('c'); cv.width = L.w; cv.height = H;
  cvDraw(cv.getContext('2d'), L);
  window.__ready = true;
})();
</script>
</body>
</html>
