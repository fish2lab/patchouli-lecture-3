<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>帕秋莉讲座 第 3 集 · 视频封面</title>
<style>
@font-face { font-family: WenKai; src: url(fonts/LXGWWenKai-Regular.ttf); font-display: block; }
html, body { margin: 0; background: #1a1418; }
canvas { display: block; max-width: 100%; margin: 0 auto; }
</style>
</head>
<body>
<!-- 第 3 集视频封面。默认 16:9（1920×1080）；?ar=43 出 4:3（1440×1080，单独排版，不是裁切）。导出 PNG：node tools/cover.mjs -->
<canvas id="c"></canvas>
<script src="src/core.js"></script>
<script src="src/kit.js"></script>
<script src="src/character/patchouli.js"></script>
<script src="src/character/cirno.js"></script>
<script src="src/props.js"></script>
<script src="src/tape.js"></script>
<script src="src/scenes/0-opening.js"></script>
<script>
'use strict';
// 第 3 集封面：深紫夜色底；左边一摞比琪露诺还高的错题卷子，绝大多数已经褪成白纸，只剩几张红叉的亮着（开场最后那个画面）；
// 琪露诺在卷子旁边得意地握拳。右边大字「能猜到的，就不用记」，下面钩子「「我是最强的」只值 1 比特」，再是副标题和系列名；
// 帕秋莉从右下角探头。
const CV_T = 2.4;
const CV_BG = '#2f2833', CV_CREAM = '#ece5d6', CV_CREAM2 = '#b9b0bd', CV_RED = '#e0a39e';
const CV_LAYOUT = {
  169: { w: 1920, pile: { x: 800, y: 1000, s: 1.4 }, cir: { x: 215, y: 1000, h: 620 },
    head: { x: 1450, y: 450, max: 820, size: 124, lines: ['能猜到的，', '就不用记'], gap: 150 }, hook: { x: 1450, y: 720, size: 56 },
    title: { x: 1450, y: 815, size: 48 }, series: { x: 1450, y: 895, size: 34 }, pch: { x: 1800, y: 1058, h: 360 } },
  43: { w: 1440, pile: { x: 560, y: 1010, s: 1.2 }, cir: { x: 150, y: 1010, h: 520 },
    head: { x: 1100, y: 420, max: 560, size: 100, lines: ['能猜到的，', '就不用记'], gap: 125 }, hook: { x: 1100, y: 650, size: 42 },
    title: { x: 1100, y: 735, size: 40 }, series: { x: 1100, y: 810, size: 30 }, pch: { x: 1330, y: 1058, h: 320 } },
};

function cvBg(c, w) {
  c.fillStyle = CV_BG; c.fillRect(0, 0, w, H);
  grain(c, polyPath(rectPts(0, 0, w, H)), .1);
  const v = c.createRadialGradient(w * .35, H * .55, H * .2, w / 2, H / 2, w * .8); v.addColorStop(0, 'rgba(255,230,190,.07)'); v.addColorStop(1, 'rgba(8,4,12,.45)');
  c.fillStyle = v; c.fillRect(0, 0, w, H);
}

function cvDraw(c, L) {
  const w = L.w;
  cvBg(c, w);
  // 一摞卷子（开场的 s0Pile，按封面放大）：大多褪白，四张亮着
  const pl = L.pile;
  c.save(); c.translate(pl.x, pl.y); c.scale(pl.s, pl.s); c.translate(-S0PILE.x, -S0PILE.y);
  s0Pile(c, { sway: 10, white: .9, glow: 1 });
  c.restore();
  drawCirno(c, { x: L.cir.x, y: L.cir.y, h: L.cir.h, pose: 'proud', mood: 'proud', facing: 1, t: CV_T, blink: 0, mouth: 0, gesture: .8 });
  // 字
  const hd = L.head, hs = Math.min(hd.size, hd.max / zhWidth(c, hd.lines[0], 100) * 100);
  hd.lines.forEach((ln, i) => zh(c, ln, hd.x, hd.y + i * hd.gap, { size: hs, align: 'center', color: CV_CREAM, outline: CV_CREAM, ow: hs * .04 }));
  zh(c, '「我是最强的」只值 1 比特', L.hook.x, L.hook.y, { size: L.hook.size, align: 'center', color: CV_RED });
  zh(c, '用信息论看人脑和大模型', L.title.x, L.title.y, { size: L.title.size, align: 'center', color: CV_CREAM });
  zh(c, '帕秋莉讲座 · 第 3 集', L.series.x, L.series.y, { size: L.series.size, align: 'center', color: CV_CREAM2 });
  drawPatchouli(c, { x: L.pch.x, y: L.pch.y, h: L.pch.h, pose: 'peek', mood: 'normal', facing: -1, look: .8, t: CV_T, blink: 0, mouth: 0 });
}

(async () => {
  await document.fonts.load('48px WenKai');
  const L = CV_LAYOUT[Q.get('ar') === '43' ? 43 : 169], cv = document.getElementById('c'); cv.width = L.w; cv.height = H;
  cvDraw(cv.getContext('2d'), L);
  window.__ready = true;
})();
</script>
</body>
</html>
