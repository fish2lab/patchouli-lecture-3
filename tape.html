<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>八音盒纸带 / 证据蜡封 样张</title>
<style>
@font-face { font-family: WenKai; src: url(fonts/LXGWWenKai-Regular.ttf); font-display: block; }
html, body { margin: 0; background: #d9d0bf; color: #221c26; font: 15px/1.4 WenKai, KaiTi, serif; }
canvas { display: block; margin: 0 auto 16px; max-width: 100%; }
</style>
</head>
<body>
<!-- 开发用样张页：纸带（几种状态 + 等宽刻度核对）、八音盒、四种蜡封。?t=秒 固定时间（不传则动画播放）；?zoom 放大两倍看缓存清晰度。
     截图：node tools/tape-shot.mjs → out/frames/tape.png -->
<div id="wrap"></div>
<script src="src/core.js"></script>
<script src="src/kit.js"></script>
<script src="src/props.js"></script>
<script src="src/bits-data.js"></script>
<script src="src/tape.js"></script>
<script>
const tpW = 1920, tpH = 1500, tpFixed = Q.has('t') ? +Q.get('t') : null;
const tpCv = document.createElement('canvas'); tpCv.width = tpW; tpCv.height = tpH; tpCv.style.width = Math.min(tpW, 1600) + 'px';
document.getElementById('wrap').appendChild(tpCv); const tpC = tpCv.getContext('2d');
const tpLine = (s, hot = {}) => BITS.lines[s].chars.map((ch, i) => ({ ch, bits: BITS.lines[s].bits[i], hot: hot[ch] || 0 }));
const tpNote = (c, s, x, y) => zh(c, s, x, y, { size: 22, color: P.g3 });

function tpDraw(t) {
  const c = tpC; c.save();
  c.fillStyle = BOOK.page; c.fillRect(0, 0, tpW, tpH); grain(c, polyPath(rectPts(0, 0, tpW, tpH)), .14);
  if (Q.has('zoom')) { c.scale(2, 2); c.translate(-60, -60); }

  // 1 八音盒送出「我是最强的！」：纸带从出口出来，孔按实测比特
  const box = tapeBox(c, 170, 170, 1, t);
  const r1 = tape(c, { x: box.out[0], y: box.out[1], cells: tpLine('我是最强的！') });
  tpNote(c, `我是最强的！ 实测 ${BITS.lines['我是最强的！'].total} 比特 · 纸带长 ${r1.len.toFixed(0)} px = ${(r1.len / TAPE.unit).toFixed(2)} × unit`, box.out[0], 262);

  // 2 正在打孔（punch 循环）：纸屑落下
  const u = tpFixed !== null ? .62 : (t * .12) % 1;
  tape(c, { x: 110, y: 380, cells: tpLine('今天的晚饭是冰冻青蛙！', { 青: 1, 蛙: 1 }), punch: u });
  tpNote(c, `打孔中 punch=${u.toFixed(2)} · 「青蛙」hot=1`, 110, 460);

  // 3 床前明月光：猜中的字几乎不打孔（minW 兜底），字号缩小
  const r3 = tape(c, { x: 110, y: 560, cells: tpLine('床前明月光，疑是地上霜。'), chSize: 26 });
  tpNote(c, `床前明月光 ${BITS.lines['床前明月光，疑是地上霜。'].total} 比特（小于 ${(TAPE.minW / TAPE.unit).toFixed(2)} 比特的格子按 minW 画）`, 110, 632);

  // 4 核对：1..8 比特和小数格，下方按 unit 画刻度，格线应落在刻度上
  const acc = [1, 2, 3, 4, 5, 6, 7, 8, .5, 1.5, 2.25, 3.75].map(b => ({ bits: b, ch: String(b) }));
  const r4 = tape(c, { x: 110, y: 740, cells: acc, chSize: 22, chColor: P.g3 });
  for (let k = 0; k * TAPE.unit <= r4.len + .1; k++) { const xx = 110 + k * TAPE.unit; c.fillStyle = k % 5 ? alpha(P.ink, .35) : P.red; c.fillRect(xx - .5, 776, 1, k % 5 ? 8 : 14); }
  tpNote(c, '核对：刻度每格 = 1 比特（红刻度每 5 比特）；格子宽 = bits × 22 px', 110, 820);
  acc.forEach((q, i) => { const [ax] = r4.at(i); c.fillStyle = P.purple; c.fillRect(ax - .5, 700, 1, 6); });

  // 5 送出一半 + 右端卷起：roll 0.35 / 0.7 / 1
  [[.35, 900], [.7, 1010], [1, 1120]].forEach(([rl, yy], i) => {
    const r = tape(c, { x: 110, y: yy, cells: tpLine('今天的晚饭是冰冻青蛙！').concat(tpLine('床前明月光，疑是地上霜。')), roll: rl, chSize: 22 });
    tpNote(c, `roll=${rl}`, 20, yy + 8);
    c.fillStyle = P.red; c.beginPath(); c.arc(r.end[0], r.end[1], 3, 0, TAU); c.fill();
  });
  tape(c, { x: 1050, y: 1030, cells: tpLine('我是最强的！'), p: .55, unit: 16, h: 48 });
  tpNote(c, 'p=0.55，unit=16，h=48（送出一半）', 1050, 1090);
  tape(c, { x: 1300, y: 1160, rot: -.12, cells: tpLine('我是最强的！'), unit: 10, h: 40, rows: 3, chSize: 20 });
  tpNote(c, 'rot=-0.12，unit=10，rows=3', 1050, 1190);

  // 6 蜡封：四种盖好的 + 一枚正在盖下（k 循环）
  const kinds = [['thm', '定理'], ['exp', '实验'], ['corr', '相关'], ['hyp', '假说']];
  kinds.forEach(([k, lb], i) => seal(c, 180 + i * 150, 1300, k, { r: 34, label: lb }));
  kinds.forEach(([k], i) => seal(c, 820 + i * 90, 1300, k, { r: 26 }));
  const kk = tpFixed !== null ? [.3, .55, .75, 1] : [((t * .5) % 1.4) / 1.2];
  kk.forEach((v, i) => seal(c, 1260 + i * 150, 1300, 'hyp', { r: 34, k: Math.min(1, v), label: '假说' }));
  tpNote(c, '盖章 k = ' + kk.map(v => Math.min(1, v).toFixed(2)).join(' / '), 1210, 1420);
  seal(c, 1500, 180, 'thm', { r: 60, label: '香农信源编码定理' });
  c.restore();
}
document.fonts.load(`40px ${ZH}`, '定实相假').then(() => document.fonts.ready).then(start, start);
function start() {
  if (tpFixed !== null) { tpDraw(tpFixed); window.__ready = true; return; }
  const t0 = performance.now(); const loop = () => { tpDraw((performance.now() - t0) / 1000); requestAnimationFrame(loop); }; loop(); window.__ready = true;
}
// 性能：画一次「两条 40 格纸带 + 八音盒 + 四枚蜡封」的平均毫秒
window.__tapeBench = n => { const cv = document.createElement('canvas'); cv.width = 1920; cv.height = 1080; const c = cv.getContext('2d');
  const cells = Array.from({ length: 40 }, (_, i) => ({ bits: 1 + hash(i, 5) * 7, ch: '字', hot: i === 20 ? 1 : 0 }));
  c.getImageData(0, 0, 1, 1); const t0 = performance.now();
  for (let i = 0; i < n; i++) { tape(c, { x: 40, y: 300, cells, punch: (i % 60) / 60, unit: 8 }); tape(c, { x: 40, y: 600, cells, roll: (i % 30) / 30, unit: 8 }); tapeBox(c, 200, 850, 1, i / 30); for (const k of Object.keys(SEAL)) seal(c, 900 + k.length * 80, 850, k, { k: (i % 20) / 20 }); }
  c.getImageData(0, 0, 1, 1); return +((performance.now() - t0) / n).toFixed(2); };
</script>
</body>
</html>
